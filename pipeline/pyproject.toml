[project]
name = "purple-rain-pipeline"
version = "0.1.0"
description = "Purple Rain payload builder: MRMS now, HRRR next-2h, ProbSevere motion"
requires-python = ">=3.12"
dependencies = [
    "eccodes>=2.47",
    "eccodeslib>=2.48",
    "requests>=2.32",
]

[project.scripts]
purple-rain = "purplerain.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purplerain"]
